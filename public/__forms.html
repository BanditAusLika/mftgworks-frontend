<!doctype html>
<html lang="en-AU">
  <head><meta charset="UTF-8" /><title>MFTG enquiry form</title></head>
  <body>
    <form name="mftg-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="mftg-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="service"><option>Service</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
